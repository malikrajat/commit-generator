# Qodana configuration for the Commit Generator IntelliJ plugin.
#
# Run locally:
#   qodana scan --config qodana.yml
#
# The project uses the JVM linter with the recommended profile for Kotlin/Java.

version: "1.0"
linter: jetbrains/qodana-jvm-community:2025.1
profile:
  name: qodana.recommended
failThreshold: 0

exclude:
  - name: All
    paths:
      - build
      - .gradle
      - .intellijPlatform
      - .github
